<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="header">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <!-- Logo et nom du site -->
            <a class="navbar-brand" th:href="@{/}">

                <img th:src="@{/img/logo_sinj_tounsi.png}"
                     alt="Logo Tunis'IA"
                     width="40"
                     height="40">

                Tunis'IA

            </a>

            <!-- Bouton du menu sur mobile -->
            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarContent"
                    aria-controls="navbarContent"
                    aria-expanded="false"
                    aria-label="Ouvrir le menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <!-- Liens de navigation -->
            <div class="collapse navbar-collapse" id="navbarContent">

                <ul class="navbar-nav ms-auto">

                    <!-- Accueil -->
                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/}"
                           th:classappend="${#httpServletRequest.requestURI == '/'} ? 'active' : ''">
                            Accueil
                        </a>
                    </li>

                    <!-- Chat -->
                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/chat}"
                           th:classappend="${#httpServletRequest.requestURI == '/chat'} ? 'active' : ''">
                            Chat
                        </a>
                    </li>

                    <!-- Administration -->
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin}">
                            Administration
                        </a>
                    </li>

                    <!-- Détails -->
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/details}">
                            Détails
                        </a>
                    </li>

                    <!-- Connexion -->
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/connexion}">
                            Connexion
                        </a>
                    </li>

                    <!-- Plan du site -->
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/plan-du-site}">
                            Plan du site
                        </a>
                    </li>

                </ul>

                <!-- Informations utilisateur -->
                <span class="navbar-text ms-lg-3">
                    Visiteur
                </span>

                <!-- Déconnexion -->
                <button class="btn btn-outline-light btn-sm ms-lg-3"
                        type="button"
                        hidden>
                    Se déconnecter
                </button>

            </div>

        </div>

    </nav>

</header>

</body>
</html>
