<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<nav class="top" th:fragment="header" aria-label="Navigation principale">

    <img th:src="@{/img/logo_sinj_tounsi.png}" alt="">
    <b>Tunis’IA</b>

    <a th:href="@{/}"
       th:classappend="${page == 'accueil'} ? 'on'">Accueil</a>

    <a th:if="${utilisateur != null}" th:href="@{/chat}"
       th:classappend="${page == 'chat'} ? 'on'">Chat</a>

    <a th:if="${utilisateur != null and utilisateur.estAdmin}" th:href="@{/administration}"
       th:classappend="${page == 'administration'} ? 'on'">Administration</a>

    <a th:if="${utilisateur != null and utilisateur.estAdmin and detailId != null}"
       th:href="@{/administration/modeles/{id}(id=${detailId})}"
       th:classappend="${page == 'detail'} ? 'on'">Détails</a>

    <a th:if="${utilisateur == null}" th:href="@{/login}"
       th:classappend="${page == 'connexion'} ? 'on'">Connexion</a>

    <a th:if="${utilisateur != null and utilisateur.estAdmin}" th:href="@{/plan-du-site}"
       th:classappend="${page == 'plan'} ? 'on'">Plan du site</a>

    <span class="who"
          th:text="${utilisateur != null ? (utilisateur.estAdmin ? 'Administrateur · ' : 'Utilisateur · ') + utilisateur.email : 'Visiteur'}">Visiteur</span>

    <form class="top-form" th:if="${utilisateur != null}"
          th:action="@{/logout}" method="post">
        <button class="out" type="submit">Se déconnecter</button>
    </form>

</nav>

</body>
</html>
