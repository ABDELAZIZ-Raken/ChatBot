<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::title}, ~{::main})}">

<head>
  <title th:text="${inscription} ? 'Créer un compte - Tunis’IA' : 'Connexion - Tunis’IA'">Connexion - Tunis’IA</title>
</head>

<body>

<main>
  <div class="login">

    <!-- Bandeau rouge à gauche -->
    <div class="hero">
      <img th:src="@{/img/logo_sinj_tounsi.png}" alt="Logo Tunis’IA">
      <h2>Tunis’IA</h2>
      <p>Discutez avec plusieurs modèles d’IA et retrouvez vos échanges.</p>
    </div>

    <!-- Formulaire à droite -->
    <div class="formbox">
      <form method="post"
            th:action="${inscription} ? @{/inscription} : @{/connexion}">

        <h1 th:text="${inscription} ? 'Créer un compte' : 'Connexion'">Connexion</h1>

        <label>Adresse e-mail
          <input name="email" type="text" inputmode="email"
                 autocomplete="username"
                 placeholder="prenom.nom@lycee.fr">
        </label>

        <label>Mot de passe
          <input name="password" type="password"
                 autocomplete="current-password"
                 placeholder="••••••••">
        </label>

        <!-- Uniquement à l'inscription -->
        <label th:if="${inscription}">Confirmer le mot de passe
          <input name="confirmation" type="password"
                 autocomplete="new-password"
                 placeholder="••••••••">
        </label>

        <!-- Message d'erreur (renvoyé par le contrôleur) -->
        <p class="login-erreur" role="alert" th:if="${erreur}" th:text="${erreur}">
          Message d'erreur
        </p>

        <button class="btn" type="submit"
                th:text="${inscription} ? 'Créer mon compte' : 'Se connecter'">
          Se connecter
        </button>

        <p class="login-bascule">
                    <span th:text="${inscription} ? 'Déjà un compte ?' : 'Pas encore de compte ?'">
                        Pas encore de compte ?
                    </span>
          <a class="lnk"
             th:href="${inscription} ? @{/connexion} : @{/inscription}"
             th:text="${inscription} ? 'Se connecter' : 'Créer un compte'">
            Créer un compte
          </a>
        </p>

        <p class="demo" th:unless="${inscription}">
          Comptes de démonstration<br>
          Utilisateur : mail@gmail.com / 123<br>
          Administrateur : admin@gmail.com / admin
        </p>

      </form>
    </div>

  </div>
</main>

</body>
</html>
