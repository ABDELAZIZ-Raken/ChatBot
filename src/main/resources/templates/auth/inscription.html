<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::title}, ~{::main})}">

<head>
    <title>Inscription - Tunis'IA</title>
</head>

<body>

<main>

    <section class="inscription-page">

        <!-- Présentation -->
        <div class="inscription-hero">

            <img th:src="@{/img/logo_sinj_tounsi.png}"
                 alt="Logo Tunis'IA">

            <h2>Rejoignez Tunis'IA</h2>

            <p>
                Discutez avec plusieurs modèles d'intelligence
                artificielle et retrouvez vos conversations.
            </p>

        </div>

        <!-- Formulaire -->
        <div class="inscription-formbox">

            <form th:action="@{/inscription}" method="post">

                <h1>Créer un compte</h1>

                <label for="nom">Nom</label>
                <input type="text"
                       id="nom"
                       name="nom"
                       placeholder="Votre nom"
                       required>

                <label for="email">Adresse e-mail</label>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="prenom.nom@lycee.fr"
                       required>

                <label for="motDePasse">Mot de passe</label>
                <input type="password"
                       id="motDePasse"
                       name="motDePasse"
                       placeholder="••••••••"
                       required>

                <label for="confirmationMotDePasse">
                    Confirmer le mot de passe
                </label>
                <input type="password"
                       id="confirmationMotDePasse"
                       name="confirmationMotDePasse"
                       placeholder="••••••••"
                       required>

                <button type="submit">
                    Créer mon compte
                </button>

                <p class="inscription-lien">
                    Déjà un compte ?
                    <a th:href="@{/connexion}">Se connecter</a>
                </p>

            </form>

        </div>

    </section>

</main>

</body>
</html>
