<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::title}, ~{::main})}">

<head>
    <title>Accueil - Tunis'IA</title>
</head>

<body>

<main>
    <div class="page">

        <!-- Bandeau de présentation -->
        <div class="card hero-accueil">
            <img th:src="@{/img/logo_sinj_tounsi.png}"
                 alt="Logo Tunis’IA">

            <div class="hero-accueil-texte">
                <h1>Tunis’IA</h1>
                <p>
                    Discutez avec plusieurs modèles d’intelligence artificielle
                    et retrouvez vos échanges. Le chat est réservé aux comptes inscrits.
                </p>
                <div class="row">
                    <a class="btn" th:if="${compte == null}" th:href="@{/connexion}">Se connecter</a>
                    <a class="btn" th:if="${compte != null}" th:href="@{/chat}">Ouvrir le chat</a>
                    <a class="btn alt" th:if="${compte == null}" th:href="@{/inscription}">Créer un compte</a>
                </div>
            </div>
        </div>

        <!-- Modèles disponibles -->
        <h2 class="titre-modeles">Modèles d’IA disponibles</h2>

        <div class="pubgrid" th:if="${!modeles.isEmpty()}">
            <div class="card" th:each="m : ${modeles}">
                <b th:text="${m.nom}">Nom du modèle</b>
                <span class="pill" th:text="${m.fournisseur.nom}"
                      style="align-self:flex-start">Fournisseur</span>
                <span class="desc-modele" th:text="${m.description}">Description</span>
            </div>
        </div>

        <p class="hint" th:if="${modeles.isEmpty()}">
            Aucun modèle n’est disponible pour le moment.
        </p>

    </div>
</main>

</body>
</html>
